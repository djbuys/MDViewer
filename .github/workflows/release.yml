name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.0, channel: stable, cache: true }
      - run: flutter build macos --release
      - run: hdiutil create -volname MDViewer -srcfolder build/macos/Build/Products/Release/MDViewer.app -ov -format UDZO MDViewer-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: MDViewer-macos.dmg }

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.0, channel: stable, cache: true }
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MDViewer-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: MDViewer-windows-x64.zip }

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/install-linux-deps.sh
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.0, channel: stable, cache: true }
      - run: flutter build linux --release
      - run: tar -czf MDViewer-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: MDViewer-linux-x64.tar.gz }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.0, channel: stable, cache: true }
      - name: Configure release signing (if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::warning::No signing secrets; the APK will be debug-signed."
          fi
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk MDViewer-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: MDViewer-android.apk }

  publish:
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
